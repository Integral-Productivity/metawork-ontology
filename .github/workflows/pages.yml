name: pages

# Build, IRI check and deploy come from ontology-tooling (ADR-0005, decision 3).
# Pinned by commit (the tag's commit, named in the comment); requirements.txt pins the
# same tag. Bump all three together.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    uses: Integral-Productivity/ontology-tooling/.github/workflows/pages.yml@d4a1aa540b49fc927c2b6d255d64c0367a13943a # v0.2.0
    # GitHub rejects the run at startup without these, even on pull requests.
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      site-class: site_hooks:MetaworkSite
