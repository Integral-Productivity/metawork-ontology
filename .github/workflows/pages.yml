name: pages

# Build, IRI check and deploy come from ontology-tooling (ADR-0005, decision 3).
# Pinned by commit (the tag's commit, named in the comment); requirements.txt pins the
# same tag. Bump all three together.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    uses: Integral-Productivity/ontology-tooling/.github/workflows/pages.yml@1e2a9e86427ae1a28974aff8bb60bc438dfe99f3 # v0.1.1
    # GitHub rejects the run at startup without these, even on pull requests.
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      site-class: site_hooks:MetaworkSite
