name: pages

# Build, IRI check and deploy come from ontology-tooling (ADR-0005, decision 3).
# Pin the same tag here and in requirements.txt, and bump both together.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    uses: Integral-Productivity/ontology-tooling/.github/workflows/pages.yml@v0.1.1
    # GitHub rejects the run at startup without these, even on pull requests.
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      site-class: site_hooks:MetaworkSite
