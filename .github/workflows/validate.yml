name: validate

# Turtle parsing, example conformance and the test run come from ontology-tooling
# (ADR-0005, decision 3). Pinned by the v0.1.1 tag's commit; requirements.txt pins the
# same tag. Bump all three together.
# Lifting .md frontmatter stays in tools/metawork_ontology.py and is tested by pytest.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: Integral-Productivity/ontology-tooling/.github/workflows/validate.yml@1e2a9e86427ae1a28974aff8bb60bc438dfe99f3 # v0.1.1
    with:
      examples: |
        examples/valid-groups.ttl
        examples/valid-groups.ttl examples/valid-decisions.ttl
      test-command: python -m pytest -q
